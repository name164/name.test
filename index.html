<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑车动画</title>
<meta name="description" content="一只鹈鹕骑自行车的 2D SVG 动画，纯 CSS 实现，无需任何依赖。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e84a3d'/%3E%3Ccircle cx='26' cy='30' r='12' fill='%23fbf7f0'/%3E%3Cpath d='M36 27h18l-7 7z' fill='%23f7a83e'/%3E%3Ccircle cx='28' cy='28' r='2' fill='%232b2b2b'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #dff2fc 0%, #c9e8f8 100%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .stage { width: min(100%, 1120px); padding: 14px 12px 22px; }
  svg { width: 100%; height: auto; display: block; }
  .caption { text-align: center; color: #5f7f96; font-size: 13px; margin-top: 10px; letter-spacing: .5px; }
  .badge-title { font-size: 22px; font-weight: 700; fill: #2c6e9e; }
  .badge-sub   { font-size: 12px; fill: #7aa2bc; }

  /* ===== 动效 ===== */
  @keyframes spin       { to { transform: rotate(360deg); } }
  @keyframes bob        { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes flapNear   { 0%, 100% { transform: rotate(-24deg); } 50% { transform: rotate(12deg); } }
  @keyframes flapFar    { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(-24deg); } }
  @keyframes dashScroll { to { stroke-dashoffset: 80px; } }
  @keyframes chainMove  { to { stroke-dashoffset: -12px; } }
  @keyframes drift1     { from { transform: translateX(-220px); } to { transform: translateX(1120px); } }
  @keyframes drift2     { from { transform: translateX(-420px); } to { transform: translateX(920px); } }
  @keyframes drift3     { from { transform: translateX(-650px); } to { transform: translateX(700px); } }
  @keyframes bushMove   { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
  @keyframes sway       { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
  @keyframes sunGlow    { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes beakOpen   { 0%, 100% { transform: rotate(0deg); } 10% { transform: rotate(0deg); } 16% { transform: rotate(-14deg); } 22% { transform: rotate(0deg); } }
  @keyframes scarfFlut  { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(7deg); } }
  @keyframes fishWiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

  .wheel     { animation: spin 1.4s linear infinite; transform-box: fill-box; transform-origin: center; }
  .crank     { animation: spin 1.4s linear infinite; transform-box: view-box; transform-origin: 440px 400px; }
  .torso     { animation: bob 1.4s ease-in-out infinite; transform-box: view-box; transform-origin: 372px 266px; }
  .wing-near { animation: flapNear .85s ease-in-out infinite; transform-box: view-box; transform-origin: 392px 246px; }
  .wing-far  { animation: flapFar .85s ease-in-out infinite; transform-box: view-box; transform-origin: 388px 244px; }
  .dashes    { animation: dashScroll .9s linear infinite; }
  .chainlink { animation: chainMove .7s linear infinite; }
  .cloud1    { animation: drift1 26s linear infinite; }
  .cloud2    { animation: drift2 32s linear infinite; }
  .cloud3    { animation: drift3 38s linear infinite; }
  .bushline  { animation: bushMove 24s linear infinite; }
  .sway      { animation: sway 3s ease-in-out infinite alternate; }
  .sun-glow  { animation: sunGlow 3.2s ease-in-out infinite; }
  .beak-lower{ animation: beakOpen 5s ease-in-out infinite; transform-box: view-box; transform-origin: 479px 176px; }
  .scarf-tail{ animation: scarfFlut 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 424px 226px; }
  .fish      { animation: fishWiggle 2s ease-in-out infinite; transform-box: view-box; transform-origin: 612px 284px; }

  @media (prefers-reduced-motion: reduce) {
    .wheel, .crank, .torso, .wing-near, .wing-far, .dashes, .chainlink,
    .cloud1, .cloud2, .cloud3, .bushline, .sway, .sun-glow,
    .beak-lower, .scarf-tail, .fish { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="鹈鹕骑自行车的 2D 动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8ed0f2"/>
        <stop offset="1" stop-color="#e8f7ff"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffd35c" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffd35c" stop-opacity="0"/>
      </radialGradient>
      <g id="cloud">
        <ellipse cx="0" cy="2" rx="30" ry="17"/>
        <ellipse cx="34" cy="-9" rx="23" ry="14"/>
        <ellipse cx="66" cy="0" rx="26" ry="15"/>
        <rect x="-16" y="-2" width="106" height="26" rx="13"/>
      </g>
    </defs>

    <!-- ===== 天空 / 太阳 / 云 ===== -->
    <rect x="0" y="0" width="900" height="360" fill="url(#sky)"/>
    <circle cx="128" cy="92" r="78" fill="url(#sunGlow)" class="sun-glow"/>
    <circle cx="128" cy="92" r="40" fill="#ffd35c"/>

    <g class="cloud1"><g transform="translate(0,80) scale(1)"><use href="#cloud" xlink:href="#cloud" fill="#fff" opacity=".95"/></g></g>
    <g class="cloud2"><g transform="translate(0,140) scale(.72)"><use href="#cloud" xlink:href="#cloud" fill="#fff" opacity=".85"/></g></g>
    <g class="cloud3"><g transform="translate(0,52) scale(1.2)"><use href="#cloud" xlink:href="#cloud" fill="#fff" opacity=".9"/></g></g>

    <!-- ===== 远景山丘 ===== -->
    <path d="M0,320 C160,282 320,300 460,290 C600,281 760,306 900,296 L900,360 L0,360 Z" fill="#d9f0c2" opacity=".95"/>
    <path d="M0,336 C130,296 250,314 380,304 C520,294 640,326 780,308 C850,301 880,318 900,312 L900,430 L0,430 Z" fill="#bfe3a4"/>

    <!-- ===== 草地 / 道路 ===== -->
    <rect x="0" y="430" width="900" height="30" fill="#8fd05f"/>
    <rect x="0" y="460" width="900" height="80" fill="#a7a29a"/>
    <rect x="0" y="460" width="900" height="4" fill="#f5f2ec" opacity=".85"/>
    <rect x="0" y="532" width="900" height="6" fill="#8b857d"/>

    <!-- 滚动灌木与花朵（视差层） -->
    <g class="bushline">
      <g transform="translate(0,447)">
        <circle cx="0" cy="0" r="22" fill="#5ea83f"/>
        <circle cx="18" cy="3" r="15" fill="#6fb94c"/>
        <circle cx="-14" cy="2" r="13" fill="#4d9633"/>
      </g>
      <g transform="translate(300,447)">
        <circle cx="0" cy="0" r="20" fill="#5ea83f"/>
        <circle cx="16" cy="2" r="14" fill="#6fb94c"/>
        <circle cx="-13" cy="3" r="12" fill="#4d9633"/>
      </g>
      <g transform="translate(600,447)">
        <circle cx="0" cy="0" r="22" fill="#5ea83f"/>
        <circle cx="18" cy="3" r="15" fill="#6fb94c"/>
        <circle cx="-14" cy="2" r="13" fill="#4d9633"/>
      </g>
      <g transform="translate(900,447)">
        <circle cx="0" cy="0" r="20" fill="#5ea83f"/>
        <circle cx="16" cy="2" r="14" fill="#6fb94c"/>
        <circle cx="-13" cy="3" r="12" fill="#4d9633"/>
      </g>
      <g transform="translate(1200,447)">
        <circle cx="0" cy="0" r="22" fill="#5ea83f"/>
        <circle cx="18" cy="3" r="15" fill="#6fb94c"/>
        <circle cx="-14" cy="2" r="13" fill="#4d9633"/>
      </g>
      <g transform="translate(150,452)">
        <circle cx="0" cy="-4" r="4" fill="#fff"/>
        <circle cx="5" cy="0" r="4" fill="#fff"/>
        <circle cx="-5" cy="0" r="4" fill="#fff"/>
        <circle cx="0" cy="4" r="4" fill="#fff"/>
        <circle cx="0" cy="0" r="3" fill="#ffd35c"/>
      </g>
      <g transform="translate(450,452)">
        <circle cx="0" cy="-4" r="4" fill="#fff"/>
        <circle cx="5" cy="0" r="4" fill="#fff"/>
        <circle cx="-5" cy="0" r="4" fill="#fff"/>
        <circle cx="0" cy="4" r="4" fill="#fff"/>
        <circle cx="0" cy="0" r="3" fill="#ffd35c"/>
      </g>
      <g transform="translate(750,452)">
        <circle cx="0" cy="-4" r="4" fill="#fff"/>
        <circle cx="5" cy="0" r="4" fill="#fff"/>
        <circle cx="-5" cy="0" r="4" fill="#fff"/>
        <circle cx="0" cy="4" r="4" fill="#fff"/>
        <circle cx="0" cy="0" r="3" fill="#ffd35c"/>
      </g>
      <g transform="translate(1050,452)">
        <circle cx="0" cy="-4" r="4" fill="#fff"/>
        <circle cx="5" cy="0" r="4" fill="#fff"/>
        <circle cx="-5" cy="0" r="4" fill="#fff"/>
        <circle cx="0" cy="4" r="4" fill="#fff"/>
        <circle cx="0" cy="0" r="3" fill="#ffd35c"/>
      </g>
    </g>

    <!-- 道路中线虚线 -->
    <line x1="0" y1="500" x2="900" y2="500" stroke="#f5f2ec" stroke-width="12" stroke-dasharray="46 34" class="dashes"/>

    <!-- ===== 车体（含轻微摇晃） ===== -->
    <g class="sway">
      <!-- 地面阴影 -->
      <ellipse cx="455" cy="462" rx="225" ry="9" fill="#000" opacity=".10"/>

      <!-- 后轮 -->
      <g class="wheel">
        <circle cx="300" cy="398" r="62" fill="none" stroke="#2e2e2e" stroke-width="10"/>
        <circle cx="300" cy="398" r="54" fill="none" stroke="#6f6f6f" stroke-width="2"/>
        <path d="M300,346 L300,450 M238,398 L362,398 M256.3,354.3 L343.7,441.7 M256.3,441.7 L343.7,354.3" stroke="#8a8a8a" stroke-width="3"/>
        <circle cx="300" cy="398" r="5.5" fill="#5a5a5a"/>
      </g>

      <!-- 前轮 -->
      <g class="wheel">
        <circle cx="610" cy="398" r="62" fill="none" stroke="#2e2e2e" stroke-width="10"/>
        <circle cx="610" cy="398" r="54" fill="none" stroke="#6f6f6f" stroke-width="2"/>
        <path d="M610,346 L610,450 M548,398 L672,398 M566.3,354.3 L653.7,441.7 M566.3,441.7 L653.7,354.3" stroke="#8a8a8a" stroke-width="3"/>
        <circle cx="610" cy="398" r="5.5" fill="#5a5a5a"/>
      </g>

      <!-- 链条（上下两段 + 飞轮 + 齿盘） -->
      <line x1="301" y1="388" x2="442" y2="378" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>
      <line x1="299" y1="408" x2="438" y2="422" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>
      <line x1="301" y1="388" x2="442" y2="378" stroke="#8a8a8a" stroke-width="7" stroke-dasharray="5 7" class="chainlink"/>
      <line x1="299" y1="408" x2="438" y2="422" stroke="#8a8a8a" stroke-width="7" stroke-dasharray="5 7" class="chainlink"/>
      <circle cx="300" cy="398" r="10" fill="#d8d8d8" stroke="#8f8f8f" stroke-width="2"/>
      <circle cx="300" cy="398" r="4" fill="#9a9a9a"/>
      <circle cx="440" cy="400" r="22" fill="#dfdfdf" stroke="#9a9a9a" stroke-width="3"/>
      <circle cx="440" cy="400" r="22" fill="none" stroke="#b7b7b7" stroke-width="3" stroke-dasharray="4 3"/>
      <circle cx="440" cy="400" r="8" fill="#c4c4c4"/>

      <!-- 远处大腿 -->
      <path d="M384,310 L440,400" stroke="#d97a2e" stroke-width="10" stroke-linecap="round"/>

      <!-- 曲柄组（小腿 + 脚 + 脚踏板） -->
      <g class="crank">
        <path d="M440,400 L421,367" stroke="#d97a2e" stroke-width="9" stroke-linecap="round"/>
        <ellipse cx="421" cy="367" rx="12" ry="5" fill="#c96f28"/>
        <path d="M440,400 L459,433" stroke="#f4a259" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="459" cy="433" rx="13" ry="5.5" fill="#e0862f"/>
        <line x1="440" y1="400" x2="421" y2="367" stroke="#5c5c5c" stroke-width="7" stroke-linecap="round"/>
        <line x1="440" y1="400" x2="459" y2="433" stroke="#5c5c5c" stroke-width="7" stroke-linecap="round"/>
        <rect x="407" y="363" width="28" height="8" rx="3" fill="#3a3a3a"/>
        <rect x="445" y="429" width="28" height="8" rx="3" fill="#3a3a3a"/>
      </g>

      <!-- 车架 -->
      <g stroke="#e84a3d" stroke-linecap="round" fill="none">
        <line x1="440" y1="400" x2="390" y2="312" stroke-width="9"/>  <!-- 座管 -->
        <line x1="392" y1="310" x2="590" y2="296" stroke-width="9"/>  <!-- 上管 -->
        <line x1="440" y1="400" x2="600" y2="364" stroke-width="9"/>  <!-- 下管 -->
        <line x1="300" y1="398" x2="440" y2="400" stroke-width="8"/>  <!-- 后下叉 -->
        <line x1="300" y1="398" x2="392" y2="310" stroke-width="7"/>  <!-- 后上叉 -->
        <path d="M600,364 C604,376 608,390 610,398" stroke-width="7"/> <!-- 前叉 -->
      </g>

      <!-- 座垫 -->
      <ellipse cx="386" cy="304" rx="30" ry="8" fill="#333"/>
      <line x1="440" y1="400" x2="390" y2="312" stroke="#c0392b" stroke-width="3"/>

      <!-- 车把 -->
      <g stroke="#e84a3d" stroke-linecap="round" fill="none">
        <line x1="590" y1="296" x2="604" y2="278" stroke-width="8"/>
        <path d="M604,278 C614,268 626,272 624,284" stroke-width="8"/>
      </g>

      <!-- 车筐 + 小鱼 -->
      <g>
        <path d="M596,296 L628,296 L622,318 L602,318 Z" fill="#c98a4b" stroke="#a86f36" stroke-width="2"/>
        <path d="M598,302 L626,302 M600,309 L624,309" stroke="#a86f36" stroke-width="1.5"/>
        <g class="fish">
          <path d="M-13,0 L-22,-7 L-22,7 Z" fill="#ff7a3d"/>
          <ellipse cx="0" cy="0" rx="14" ry="7" fill="#ff8c42"/>
          <circle cx="6" cy="-1.5" r="2" fill="#2b2b2b"/>
          <path d="M0,-7 C4,-10 8,-8 6,-5" fill="#ffa05e"/>
        </g>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <!-- 远处翅膀 -->
      <g class="wing-far">
        <path d="M388,244 C352,200 286,192 272,218 C286,230 340,250 388,244 Z" fill="#e6e0d2" stroke="#cfc8b8" stroke-width="2"/>
      </g>

      <!-- 躯干组（上下颠簸） -->
      <g class="torso">
        <!-- 身体 -->
        <ellipse cx="372" cy="266" rx="66" ry="52" fill="#fbf7f0" stroke="#e3dccf" stroke-width="2.5"/>
        <ellipse cx="356" cy="286" rx="42" ry="28" fill="#f0e9dc"/>
        <!-- 尾巴 -->
        <path d="M322,286 L276,300 L314,312 Z" fill="#fbf7f0" stroke="#e3dccf" stroke-width="2"/>
        <path d="M316,294 L282,310 L310,318 Z" fill="#f0e9dc"/>

        <!-- 脖子 -->
        <path d="M412,244 C426,222 440,204 456,190" stroke="#e3dccf" stroke-width="27" stroke-linecap="round" fill="none"/>
        <path d="M412,244 C426,222 440,204 456,190" stroke="#fbf7f0" stroke-width="22" stroke-linecap="round" fill="none"/>

        <!-- 头 -->
        <circle cx="458" cy="180" r="24" fill="#fbf7f0" stroke="#e3dccf" stroke-width="2.5"/>
        <!-- 头冠 -->
        <path d="M446,160 Q450,150 460,156 M464,154 Q468,146 476,152" stroke="#fbf7f0" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- 眼睛 / 腮红 -->
        <circle cx="469" cy="173" r="4.2" fill="#2b2b2b"/>
        <circle cx="471" cy="171" r="1.5" fill="#fff"/>
        <ellipse cx="461" cy="186" rx="5" ry="3.2" fill="#f6c8b0" opacity=".75"/>

        <!-- 上喙 -->
        <path d="M479,176 Q545,186 614,191 Q558,180 479,180 Z" fill="#f7a83e" stroke="#e08c22" stroke-width="2"/>
        <!-- 喉囊（开合） -->
        <g transform="translate(479,176)">
          <g class="beak-lower">
            <path d="M0,2 C28,10 88,16 131,14 C108,38 58,46 24,32 C10,26 4,12 0,2 Z" fill="#f9c74f" stroke="#e8a33d" stroke-width="2"/>
          </g>
        </g>

        <!-- 围巾 -->
        <path d="M414,222 Q436,210 452,216" stroke="#e84a3d" stroke-width="10" stroke-linecap="round" fill="none"/>
        <g class="scarf-tail">
          <path d="M424,226 Q412,242 396,258" stroke="#e84a3d" stroke-width="7" stroke-linecap="round" fill="none"/>
          <path d="M430,222 Q426,246 420,266" stroke="#c93a30" stroke-width="6" stroke-linecap="round" fill="none"/>
        </g>

        <!-- 近处翅膀 -->
        <g class="wing-near">
          <path d="M392,246 C358,198 274,190 258,220 C272,234 336,256 392,246 Z" fill="#fdfaf3" stroke="#e0d8c8" stroke-width="2"/>
          <path d="M272,208 C256,220 256,224 256,224 C270,236 290,240 304,238 C284,216 276,210 272,208 Z" fill="#3a3a3a"/>
        </g>
      </g>

      <!-- 近处大腿 -->
      <path d="M386,312 L440,400" stroke="#f4a259" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- ===== 标题角标 ===== -->
    <g>
      <rect x="24" y="22" width="208" height="58" rx="18" fill="#ffffff" opacity=".88"/>
      <text x="128" y="47" text-anchor="middle" class="badge-title">鹈鹕骑车记</text>
      <text x="128" y="66" text-anchor="middle" class="badge-sub">Pelican on a Bike · 2D SVG</text>
    </g>
  </svg>
  <p class="caption">纯 SVG + CSS 动画 · 无任何外部依赖，双击文件即可在浏览器播放</p>
</div>
</body>
</html>
